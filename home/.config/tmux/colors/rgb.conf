
# Session name: neutral gray pill with dark text
set -g status-left-style "fg=#1e2127,bg=#abb2bf,bold"
set -g status-style "fg=color7,bg=#1e2127"

# Active tab: high contrast pill - dark text on bright blue
set -g window-status-current-style "fg=#1e2127,bg=#61afef,bold"

# Inactive tabs: slightly lighter for better visibility
set -g window-status-style "fg=#848b98,bg=#2c323c"

# Activity: muted amber for windows needing attention
set -g window-status-activity-style "fg=#1e2127,bg=#a68a4a"

# Pane borders
set -g pane-border-style "fg=#3e4452"
set -g pane-active-border-style "fg=#e5c07b"

# Git branch: muted gray pill (subtler than session)
set -g status-right-style "fg=#abb2bf,bg=#3e4452"
