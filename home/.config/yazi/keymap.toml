# https://yazi-rs.github.io/docs/configuration/keymap

mgr.prepend_keymap = [

  { on = "<Enter>", run = "plugin smart-enter", desc = "Enter the child directory, or open the file" },
  { on = "M", run = "plugin mount" },
  { on = "<C-n>", run = "plugin move-to-new-folder", desc = "New folder with selection" },
  { on = "C", run = "plugin ouch", desc = "Compress selection with ouch" },
  { on = "X", run = 'shell --block -- ouch d -y %h', desc = "Decompress hovered archive with ouch" },
  { on = "T", run = "plugin toggle-pane min-preview", desc = "Show or hide the preview pane" },
  { on = "H", run = "hidden toggle", desc = "Toggle hidden files" },
  { on = "u", run = 'shell --block -- /home/wh1le/.config/yazi/scripts/personal/send-to-transmission "$@"', desc = "Send torrent(s) to Transmission" },

  # media: nested play under hovered dir (or current dir), as detached mpv windows
  { on = [ "p", "a" ], run = 'shell -- setsid -f /home/wh1le/.config/yazi/scripts/play-all-nested-audios "$1"', desc = "Play nested audio" },
  { on = [ "p", "v" ], run = 'shell -- setsid -f /home/wh1le/.config/yazi/scripts/play-all-nested-videos "$1"', desc = "Play nested video" },
  { on = [ "p", "i" ], run = 'shell -- setsid -f /home/wh1le/.config/yazi/scripts/play-all-nested-images "$1"', desc = "View nested images" },

  # vim like motions
  { on = "1", run = "plugin relative-motions 1", desc = "Move in relative steps" },
  { on = "2", run = "plugin relative-motions 2", desc = "Move in relative steps" },
  { on = "3", run = "plugin relative-motions 3", desc = "Move in relative steps" },
  { on = "4", run = "plugin relative-motions 4", desc = "Move in relative steps" },
  { on = "5", run = "plugin relative-motions 5", desc = "Move in relative steps" },
  { on = "6", run = "plugin relative-motions 6", desc = "Move in relative steps" },
  { on = "7", run = "plugin relative-motions 7", desc = "Move in relative steps" },
  { on = "8", run = "plugin relative-motions 8", desc = "Move in relative steps" },
  { on = "9", run = "plugin relative-motions 9", desc = "Move in relative steps" },
]
