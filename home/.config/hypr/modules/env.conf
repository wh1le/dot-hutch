env = XDG_CURRENT_DESKTOP, Hyprland
env = GTK_MODULES, canberra-gtk-module

env = XCURSOR_PATH, "$HOME/.local/share/icons:/run/current-system/sw/share/icons"
env = XCURSOR_THEME, "BreezeX-RosePine-Linux"
env = HYPRCURSOR_THEME,rose-pine-hyprcursor
exec-once = gsettings set org.gnome.desktop.interface cursor-theme BreezeX-RosePine-Linux
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24
exec-once = if [ "$(hostname)" = "thinkpad" ]; then gsettings set org.gnome.desktop.interface text-scaling-factor 0.9; else gsettings set org.gnome.desktop.interface text-scaling-factor 1.2; fi

exec-once = xrdb -merge ~/.Xresources && [[ "$(hostname)" == "homepc" ]] && echo "Xft.dpi: 140" | xrdb -merge
