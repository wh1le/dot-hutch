animations { # https://wiki.hyprland.org/Configuring/Variables/#animations
  enabled = yes

  # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
  bezier = easeOutQuint,0.23,1,0.32,1
  bezier = easeInOutCubic,0.65,0.05,0.36,1
  bezier = linear,0,0,1,1
  bezier = almostLinear,0.5,0.5,0.75,1.0
  bezier = quick,0.15,0,0.1,1

  animation = global, 1, 1, quick

  animation = border, 1, 1, quick
  animation = windows, 0
  animation = windowsIn, 0
  animation = windowsOut, 0

  animation = fadeIn, 0
  animation = fadeOut, 0
  animation = fade, 1, 1, quick

  animation = layers, 1, 1, quick, fade
  animation = layersIn, 1, 1, quick, fade
  animation = layersOut, 1, 1, quick, fade

  animation = fadeLayersIn, 1, 1, quick
  animation = fadeLayersOut, 1, 1, quick

  animation = workspaces,    1, 0.2, quick, slidevert
  animation = workspacesIn,  1, 0.2, quick, slidevert
  animation = workspacesOut, 1, 0.2, quick, slidevert

  animation = specialWorkspace, 1, 0.2, quick, fade
}
