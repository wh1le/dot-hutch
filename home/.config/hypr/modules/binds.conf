# https://wiki.hyprland.org/Configuring/Binds

# Applications
bind = $main, Return,   exec, kitty -1
# bind = $main, S,             exec, uwsm app -- gradia --screenshot
# bind = $main SHIFT, S,      exec, uwsm app -- gradia --screenshot=FULL
# bind = $main SHIFT CTRL, S, exec, grim -g "$(hyprctl activewindow -j | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" - | gradia
bind = $main, S,             exec, uwsm app -- $HOME/.local/bin/public/screenshoot --region
bind = $main SHIFT, S,      exec, uwsm app -- $HOME/.local/bin/public/screenshoot
bind = $main SHIFT, R,      exec, uwsm app -- $HOME/.local/bin/public/screenrecord
# bind = $main SHIFT, H,  exec, quickshell msg minimize-tray hide
bind = $main, E,        exec, uwsm app -- nautilus
bind = $main, D,        exec, quickshell ipc call launcher toggle
bind = $main, P,        exec, quickshell ipc call menu toggle
bind = $main, I,        exec, quickshell ipc call quick-copy toggle

bind = $main SHIFT, I,     exec, uwsm app -- $HOME/.local/bin/public/menu/launch-kitty wallpaper
bind = $main, SPACE, exec, hyprctl switchxkblayout all next; pkill -RTMIN+6 waybar
# bind = $main, MINUS,       exec, $HOME/.local/bin/public/wallpaper/set-ink

bind  = $main SHIFT, backslash,    exec, uwsm app -- $HOME/.local/bin/public/bluetooth/connect-xm6
bindl = $main SHIFT, b,            exec, $HOME/.local/bin/public/hardware/set-keyboard-backlight

bind  = $main SHIFT, slash,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind  = $main SHIFT, bracketLeft,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 3%-
bind  = $main SHIFT, bracketRight, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 3%+

bind  = $main SHIFT, N,            exec, swaync-client -t -sw
bind  = $main SHIFT, D,            exec, swaync-client -d -sw
bind  = $main, BACKSPACE,          exec, dismiss-and-fix-layout-swaync

bind = ALT, Tab, exec, snappy-switcher next
bind = ALT SHIFT, Tab, exec, snappy-switcher prev

bind = $main SHIFT, semicolon,  exec, $HOME/.local/bin/public/hardware/set-monitor-brightness down 7
bind = $main SHIFT, apostrophe, exec, $HOME/.local/bin/public/hardware/set-monitor-brightness up 7

bind = $main, M,             exec, $HOME/.local/bin/public/play-clipboard
bind = $main SHIFT, p,      exec, playerctl play-pause
bind = $main SHIFT, comma,  exec, playerctl previous
bind = $main SHIFT, period, exec, playerctl next

bind = $main, 1, workspace, 1
bind = $main, 2, workspace, 2
bind = $main, 3, workspace, 3
bind = $main, 4, workspace, 4
bind = $main, 5, workspace, 5
bind = $main, 6, workspace, 6
bind = $main, 7, workspace, 7
bind = $main, 8, workspace, 8
bind = $main, 9, workspace, 9
bind = $main, 0, workspace, 10

bind = $main SHIFT, 1, movetoworkspacesilent, 1
bind = $main SHIFT, 2, movetoworkspacesilent, 2
bind = $main SHIFT, 3, movetoworkspacesilent, 3
bind = $main SHIFT, 4, movetoworkspacesilent, 4
bind = $main SHIFT, 5, movetoworkspacesilent, 5
bind = $main SHIFT, 6, movetoworkspacesilent, 6
bind = $main SHIFT, 7, movetoworkspacesilent, 7
bind = $main SHIFT, 8, movetoworkspacesilent, 8
bind = $main SHIFT, 9, movetoworkspacesilent, 9
bind = $main SHIFT, 0, movetoworkspacesilent, 10

bind = $main_CTRL_SHIFT, 1, movecurrentworkspacetomonitor, +1
bind = $main_CTRL_SHIFT, 2, movecurrentworkspacetomonitor, -1

bind = $main, mouse_down, workspace, e+1
bind = $main, mouse_up, workspace, e-1

bind = $main, grave, workspace, previous

bind = $main, H, exec, $HOME/.config/hypr/scripts/focus-tiled
bind = $main, L, exec, $HOME/.config/hypr/scripts/focus-tiled
bind = $main, K, exec, $HOME/.config/hypr/scripts/focus-tiled
bind = $main, J, exec, $HOME/.config/hypr/scripts/focus-tiled

bind = $main, H, movefocus, l
bind = $main, L, movefocus, r
bind = $main, K, movefocus, u
bind = $main, J, movefocus, d

bind = CTRL, h, exec, $HOME/.config/hypr/scripts/seamless-focus.sh l h
bind = CTRL, j, exec, $HOME/.config/hypr/scripts/seamless-focus.sh d j
bind = CTRL, k, exec, $HOME/.config/hypr/scripts/seamless-focus.sh u k
bind = CTRL, l, exec, $HOME/.config/hypr/scripts/seamless-focus.sh r l

bind = $main, Tab,       exec, $HOME/.config/hypr/scripts/cycle-float-windows
bind = $main SHIFT, Tab, exec, $HOME/.config/hypr/scripts/cycle-float-windows prev

bind = $main, F, fullscreen
bind = $main SHIFT, F, fullscreenstate, 0 2

bind = $main, V, togglefloating,
bind = $main, Q, exec, $HOME/.config/hypr/scripts/smart-close
bind = $main SHIFT, Q, exec, hyprctl dispatch killactive

bind = $main CTRL, H, swapwindow, l
bind = $main CTRL, L, swapwindow, r
bind = $main CTRL, K, swapwindow, u
bind = $main CTRL, J, swapwindow, d
bind = $main CTRL, S, layoutmsg, togglesplit

binde = SHIFT ALT, H, moveactive, -50 0
binde = SHIFT ALT, L, moveactive, 50 0
binde = SHIFT ALT, K, moveactive, 0 -50
binde = SHIFT ALT, J, moveactive, 0 50
binde = SHIFT ALT, C, centerwindow
bindm = $main, mouse:272, movewindow
bindm = $main, mouse:273, resizewindow

bind = $main SHIFT, H, movewindoworgroup, l
bind = $main SHIFT, L, movewindoworgroup, r
bind = $main SHIFT, K, movewindoworgroup, u
bind = $main SHIFT, J, movewindoworgroup, d

bind = $main SHIFT, H, movewindow, l
bind = $main SHIFT, L, movewindow, r
bind = $main SHIFT, K, movewindow, u
bind = $main SHIFT, J, movewindow, d

bind = $main, R, submap, R
submap = R
binde = , l, resizeactive, 20 0
binde = , h, resizeactive, -20 0
binde = , k, resizeactive, 0 -20
binde = , j, resizeactive, 0 20
bind = , escape, submap, reset # Use `reset` to go back to the global submap
bind = CTRL, bracketleft, submap, reset
bind = , q, submap, reset
submap = reset

bind = $main SHIFT, G, togglegroup
bind = $main, N, changegroupactive, f

bind = $main ALT, F, submap, passthrough
submap = passthrough
bind = $main, Escape, submap, reset
bind = $main ALT, F, submap, reset
submap = reset

bind = $main SHIFT, L, pin
