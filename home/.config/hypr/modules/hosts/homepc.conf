$main = SUPER

env = MOZ_DISABLE_RDD_SANDBOX,1
env = GBM_BACKEND, nvidia-drm

general {
  border_size = 3
}

input {
  kb_model = "apple"
  # kb_options = "ctrl:swapcaps"
}

device[magic-keyboard] {
  kb_model = "apple"
  # kb_options = "ctrl:swapcaps"
}

device[keyboard-passthrough] {
  kb_model = "thinkpad"
  kb_layout = us,ru
}

workspace = 1, monitor:desc:DSC Paperlike13K 0x00003400
workspace = 2, monitor:desc:DSC Paperlike13K 0x00003400
workspace = 3, monitor:desc:DSC Paperlike13K 0x00003400
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-1
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-1
workspace = 10, monitor:DP-1

# monitor = HDMI-A-1, 3200x2400@37, 0x720, 2.5
# monitor = DP-1, 3840x2160@60, 1280x0, 1.5, transform, 1

monitor = desc:DSC Paperlike13K 0x00003400, 3200x2400@37, 0x720, 2.0
monitor = desc:LG Electronics LG HDR 4K 0x00013533, 3840x2160@60, 1280x0, 1.6

# VR streaming virtual monitor (ALVR)
monitor = HEADLESS-1, 3840x2160@120, 9999x0, 1

# ALVR dashboard: suppress "not responding" on workspace switch
windowrule = match:class ^(alvr.dashboard)$, suppress_event activatefocus
windowrule = match:class ^(alvr.dashboard)$, no_anim on

# exec = for i in {1..3}; do hyprctl dispatch moveworkspacetomonitor $i HDMI-A-1; done
# exec = for i in {4..10}; do hyprctl dispatch moveworkspacetomonitor $i DP-1; done
