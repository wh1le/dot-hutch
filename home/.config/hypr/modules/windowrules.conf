windowrule = match:workspace 1, tile on
windowrule = match:workspace 2, tile on
windowrule = match:workspace 3, tile on
windowrule = match:workspace 4, tile on
windowrule = match:workspace 5, tile on
windowrule = match:workspace 6, tile on
windowrule = match:workspace 7, tile on
windowrule = match:workspace 8, tile on
windowrule = match:workspace 9, tile on
windowrule = match:workspace 10, tile on

windowrule {
  name = fix-steam-float
  match:class = steam
  match:initial_title = Steam
  match:float = 1

  float = off
  maximize = on
}

windowrule {
  name = xwayland-drag-fix
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
  no_focus = on
}

windowrule = match:class .*, float on

# Ignore maximize requests from apps. You'll probably like this.
windowrule = match:class .*, suppress_event maximize

# Launcher
# windowrule = match:class ^(launcher)$, float on
windowrule = match:class ^(launcher)$, size 350 300
windowrule = match:class ^(launcher)$, center on
windowrule = match:class ^(launcher)$, border_size 2

# Quickshell menu mode terminals
windowrule = match:class ^(terminal-quickshell)$, float on
windowrule = match:class ^(terminal-quickshell)$, center on
windowrule = match:class ^(terminal-quickshell)$, border_size 2

# Qemu
windowrule = match:class ^(qemu)$, tile on
windowrule = match:class ^(qemu)$, size 1200 800

windowrule = match:class .*(vlc).*, float on
windowrule = match:title (.*VLC media player.*), float on
windowrule = match:class .*(vlc).*, no_blur on
windowrule = match:class .*(vlc).*, opacity 1.0 override 1.0 override
windowrule = match:class .*(librewolf).*, no_blur on
windowrule = match:class .*(librewolf).*, opacity 1.0 override 1.0 override

windowrule = match:class .*(telegram).*, opacity 1.0 override 1.0 override
windowrule = match:class .*(telegram).*, tile on
# windowrule = match:class .*(Nautilus).*, tile on
# windowrule = match:class .*(org.gnome.Nautilus).*, tile on
windowrule = match:class .*(librewolf).*, tile on

windowrule = match:class .*(steam_app_default).*, no_blur on
windowrule = match:class .*(steam_app_default).*, opacity 1.0 override 1.0 override

# Mega
# windowrule = match:class .*(mega).*, float on
windowrule = match:title (.*mega*), size 400 600

# Firefox
windowrule = match:class ^(firefox)$, tile on
windowrule = match:class ^(firefox)$, no_blur on
windowrule = match:class ^(firefox)$, opacity 1.0 override 1.0 override
windowrule = match:title (.*Save.*), size 400 600
windowrule = match:title (.*File Upload.*), size 400 600
windowrule = match:title (.*Open.*), size 400 600
# windowrule = match:class ^(firefox)$, match:modal 1, float on
windowrule = match:class ^(firefox)$, match:modal 1, center on

# Calculator
# windowrule = match:title (.*Calculator.*), float on
windowrule = match:title (.*Calculator.*), size 400 600

# Gaming
windowrule = match:class ^(google-chrome)$, match:title (^X.*p$), size 272 355
windowrule = match:class ^(google-chrome)$, match:title (^X.*p$), pin on
windowrule = match:class ^(google-chrome)$, match:title (^X.*p$), center on
windowrule = match:class ^(google-chrome)$, match:title (^X.*p$), opacity 0.9 0.6
windowrule = match:class ^(google-chrome)$, match:title (^X.*p$), no_shadow on

# Attempt to fix conky blur
# windowrule = match:class ^(kitty)$, opacity 1.0 override 1.0 override
# windowrule = match:class ^(kitty)$, no_blur on

# conky desktop widget: lock to workspace 1, float, no focus/border/blur/shadow, below
windowrule = match:class ^(conky)$, float on
windowrule = match:class ^(conky)$, workspace 1 silent
windowrule = match:class ^(conky)$, no_focus on
windowrule = match:class ^(conky)$, no_blur on
windowrule = match:class ^(conky)$, no_shadow on

windowrule = match:class ^(mpv)$, tile on
windowrule = match:class ^(mpv)$, idle_inhibit focus
windowrule = match:class ^(mpv)$, no_blur on
windowrule = match:class ^(mpv)$, opacity 1.0 override 1.0 override
windowrule = match:class ^(com.github.dahenson.agenda)$, opacity 1.0 override 1.0 override
windowrule = match:class ^(zoom)$, idle_inhibit focus
windowrule = match:class ^(zoom)$, group set
windowrule = match:title ^.*Meet.*$, idle_inhibit focus
windowrule = match:title ^.*YouTube.*$, idle_inhibit focus

# qute
windowrule = match:class (.*qutebrowser.*), focus_on_activate off
windowrule = match:class ^(qute-editor)$, float on
windowrule = match:class ^(qute-editor)$, size 900 600
windowrule = match:class ^(qute-editor)$, center on
windowrule = match:class ^(qute-editor)$, stay_focused on

# yazi
windowrule = match:class ^(floating-yazi)$, float on
windowrule = match:class ^(floating-yazi)$, size 900 700
windowrule = match:class ^(floating-yazi)$, center on

# Tile
windowrule = match:class (.*obsidian.*), opacity 1.0 override 1.0 override
windowrule = match:class (.*obsidian.*), tile on
# windowrule = match:class (.*obsidian.*), group set
windowrule = match:class (.*kitty.*), tile on
windowrule = match:class (.*kitty.*), focus_on_activate off
windowrule = match:class (.*kitty.*), suppress_event activate
windowrule = match:class (.*kitty.*), suppress_event activatefocus
windowrule = match:class .*(im.py).*, tile on
windowrule = match:class (.*qutebrowser.*), tile on
windowrule = match:class (.*ymuse.*), tile on
windowrule = match:class (.*chrom.*), tile on
windowrule = match:class (.*Chrom.*), tile on
windowrule = match:class ^(totem-.*), tile on
windowrule = match:class ^(totem-.*), no_blur on
windowrule = match:class ^(totem-.*), opacity 1.0 override 1.0 override
windowrule = match:class (.*thunar.*), tile on
windowrule = match:class ^(thunar)$, match:title ^(File Operation Progress)$, float on
windowrule = match:class ^(thunar)$, match:title ^(Rename .*)$, float on
windowrule = match:class ^(thunar)$, match:title ^(.*Properties.*)$, float on
windowrule = match:class ^(thunar)$, match:title ^(Confirm to replace files)$, float on

